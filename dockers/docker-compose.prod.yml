services:

  web:
    image: barbershop-web:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - barbershop-network-web

networks:
  barbershop-network-web:
    driver: bridge
